[build-system]
requires = ["setuptools>=71,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "feedingrobot"
version = "0.3.0"
description = "State-driven feeding simulation: M0, M1 and M3"
requires-python = ">=3.12,<3.13"
dependencies = ["mujoco==3.14.0", "numpy==2.2.6", "mink==1.3.0", "gymnasium==1.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["long: physical acceptance matrix"]
